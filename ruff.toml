# Lint configuration for Eris.
#
# Intentionally permissive: the goal is to catch real breakage (syntax errors,
# undefined names, bad except clauses) on every push without reformatting a
# working codebase. The ignores below are deliberate debt, not style opinions --
# each one is a pattern that exists in the current tree and is safe in context.
# Tighten them one rule at a time.

target-version = "py311"
line-length = 120
extend-exclude = [".venv", "venv", "src", "htmlcov", "data", "logs"]

[lint]
# Default ruff selection: pycodestyle errors (subset) + pyflakes.
# F821 (undefined name) and E9xx (syntax/IO errors) are the load-bearing rules.
select = ["E4", "E7", "E9", "F"]

ignore = [
    "E402",  # module-import-not-at-top: run.py/tests mutate sys.path before importing
    "E712",  # comparison-to-True: present in existing test assertions
    "E722",  # bare-except: one fallback in modules/crawlers/browser.py
    "F401",  # unused-import: package __init__.py files re-export public API
    "F541",  # f-string-missing-placeholders: cosmetic, in log/print strings
    "F811",  # redefined-while-unused: duplicate `nltk` import in tools/meta_chunking_demo.py
    "F841",  # unused-variable: assigned-but-unused locals in content_quality/summarizer/markdown
]

[lint.per-file-ignores]
# Test modules lean on wildcard-ish imports and unused fixtures.
"tests/*" = ["F811", "F841"]
# The skipped legacy tests still name summarize_source /
# generate_combined_summary, which modules/summarizer.py no longer exports.
# They are marked `@legacy_api` (skipped) pending a rewrite; see the note at the
# top of the file.
"tests/test_summarizer.py" = ["F811", "F841", "F821"]
